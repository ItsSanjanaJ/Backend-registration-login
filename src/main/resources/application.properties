# =============================================================
# RegLogBackApp configuration
# =============================================================

spring.application.name=RegLogBackApp
server.port=${PORT:8080}

# -----------------------------------------------------------
# MySQL database connection.
# Values are read from environment variables first, falling
# back to the local development defaults shown here.
# NEVER put real production passwords in this file.
# -----------------------------------------------------------
spring.datasource.url=jdbc:mysql://mysql-17302d92-sanjanajamakhandi05-c646.b.aivencloud.com:13698/reglogdb?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates / updates tables automatically (dev mode)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -----------------------------------------------------------
# JWT configuration.
# jwt.secret must be at least 32 characters long for HS256.
# Override both via environment variables in production.
# -----------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.cookie-name=${JWT_COOKIE_NAME:jwt}
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}

# -----------------------------------------------------------
# CORS: the React frontend development server origin.
# -----------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://frontend-registration-login-89857f29d-itssanjanaj.vercel.app}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.reglog=DEBUG